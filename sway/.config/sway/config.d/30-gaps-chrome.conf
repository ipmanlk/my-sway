# Omarchy-like gaps + window chrome (user override, loads after system defaults)
# Palette matches Waybar: bg #101214, border #2a2e33, accent Tokyo Night blue #7aa2f7

# Gaps: airy inner, slim outer; outer gaps stay even with a single window (Omarchy-like)
gaps inner 2
gaps outer 2
smart_gaps off

# Thin borders, minimal titlebar text
default_border pixel 2
default_floating_border pixel 2
font pango:JetBrainsMono Nerd Font 10

# Window chrome colors: class, border, background, text, indicator, child_border
client.focused          #7aa2f7 #101214 #ffffff #7aa2f7 #7aa2f7
client.focused_inactive #2a2e33 #101214 #8a8a8a #2a2e33 #2a2e33
client.unfocused        #2a2e33 #101214 #8a8a8a #2a2e33 #2a2e33
client.urgent           #e06c75 #101214 #ffffff #e06c75 #e06c75
client.placeholder      #2a2e33 #101214 #8a8a8a #2a2e33 #2a2e33
