# Productivity extras: screenshots, night light, window switcher, clipboard.

# --- Screenshots (Omarchy-like): file + clipboard + notification ---
bindcode 107 exec $HOME/.local/bin/sway-screenshot region
bindcode Shift+107 exec $HOME/.local/bin/sway-screenshot full
bindcode Control+107 exec $HOME/.local/bin/sway-screenshot window
# Fallback (works even if the VM never delivers keycode 107):
bindsym $mod+Shift+s exec $HOME/.local/bin/sway-screenshot region

# --- Screen recording toggle (needs: sudo dnf install wf-recorder) ---
bindsym $mod+Shift+r exec $HOME/.local/bin/sway-record

# --- Night light toggle (needs: sudo dnf install gammastep) ---
bindsym $mod+Shift+n exec $HOME/.local/bin/nightlight-toggle

# --- Rofi window switcher ---
bindsym $mod+Tab exec rofi -show window

# --- Clipboard history (needs: sudo dnf install cliphist; wl-clipboard ships with the spin) ---
exec wl-paste --watch $HOME/.local/bin/cliphist store
bindsym $mod+Shift+v exec $HOME/.local/bin/cliphist list | rofi -dmenu -p Clipboard | $HOME/.local/bin/cliphist decode | wl-copy
bindsym $mod+Shift+x exec $HOME/.local/bin/cliphist wipe
